<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angle Mouse Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#03060F;--panel:#0A1230;--panel2:#0F1A44;--line:#1B2C6B;--blue:#2F6BFF;--neon:#35E0FF;--ice:#CFE0FF;--text:#EAF0FF;--muted:#94A4D0;
--head:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;--body:Manrope,system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:var(--body);line-height:1.6;background-color:var(--bg);
background-image:radial-gradient(90% 38% at 50% 0,#1646D966,transparent 70%),linear-gradient(#2F6BFF12 1px,transparent 1px),linear-gradient(90deg,#2F6BFF12 1px,transparent 1px);background-size:auto,36px 36px,36px 36px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
.hero{padding:26px 0 0}
.hero::after{content:"";display:block;height:2px;margin:28px 20px 0;background:linear-gradient(90deg,transparent,var(--neon),transparent);box-shadow:0 0 14px var(--neon);opacity:.75}
.topbar{display:flex;align-items:center;gap:14px;text-align:left}
.topbar img{flex:none;width:44%;max-width:210px;height:auto;display:block;filter:drop-shadow(0 0 14px #2F6BFFaa)}
.tcol{flex:1;min-width:0}
.dev{margin:0 0 12px;font:700 clamp(24px,7.5vw,32px)/1.1 var(--head);text-transform:uppercase;letter-spacing:.08em}
.dev::after{content:"";display:block;width:48px;height:3px;margin-top:8px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips span{padding:5px 14px;background:linear-gradient(135deg,#1B3FB8,#0A1230);color:var(--ice);font:600 11px/1.4 var(--head);letter-spacing:.06em;text-transform:uppercase;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
section{padding:30px 0}
h2{font:700 22px var(--head);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
section .wrap>h2::before,.ftitle::before{content:"// ";color:var(--neon)}
.sub{color:var(--muted);margin:0 0 22px}
.pcard{position:relative;padding:1.5px;border-radius:28px;background:linear-gradient(135deg,var(--neon),var(--blue) 35%,var(--line) 65%,var(--blue));box-shadow:0 0 40px #2F6BFF44}
.pin{position:relative;border-radius:26.5px;padding:36px 16px 16px;text-align:center;background:linear-gradient(180deg,#0F1C4F,var(--panel) 35%,#070D26)}
.pin::before,.pin::after{content:"";position:absolute;width:20px;height:20px;border:2px solid var(--neon);pointer-events:none;filter:drop-shadow(0 0 4px var(--neon))}
.pin::before{top:9px;left:9px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.pin::after{bottom:9px;right:9px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.chead{display:flex;gap:16px;align-items:center;text-align:left}
.cicon{flex:none;width:88px;height:88px;border-radius:22px;display:block;box-shadow:0 0 0 2px var(--blue),0 0 28px #2F6BFF99}
.cname{font-size:21px;line-height:1.15;letter-spacing:.04em;margin:0 0 10px}
.badge{display:inline-flex;align-items:center;gap:8px;font:700 11px var(--head);letter-spacing:.14em;text-transform:uppercase;background:#35E0FF1A;color:var(--neon);border:1px solid var(--neon);padding:5px 12px;border-radius:99px;box-shadow:0 0 14px #35E0FF44}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.cdesc{margin:16px 0;color:var(--muted);font-size:14px;text-align:left}
.vbtn{display:block;margin:0 0 24px;padding:14px 20px;border-radius:14px;border:1.5px solid var(--blue);font:700 15px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--ice);cursor:not-allowed;background:repeating-linear-gradient(135deg,#0F1A44 0 10px,#0A1230 10px 20px);box-shadow:inset 0 0 18px #2F6BFF33}
.ftitle{font-size:20px;margin:0 0 12px;text-align:left}
.flist{text-align:left}
.feat{display:flex;gap:14px;align-items:center;margin-top:10px;padding:14px 16px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#111E50,#0B1438)}
.num{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 16px var(--head);color:var(--neon);background:#35E0FF14;border:1px solid #35E0FF66;text-shadow:0 0 8px var(--neon)}
.feat h3{font:700 16px var(--head);letter-spacing:.04em;text-transform:uppercase;margin:0 0 2px}
.feat p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
details{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
details[open]{border-color:var(--blue);box-shadow:0 0 22px #2F6BFF33}
summary{list-style:none;cursor:pointer;padding:14px 16px 14px 18px;font:700 16px var(--head);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--blue);border-radius:9px;color:var(--neon);font-size:20px;line-height:1}
details[open] summary::after{content:"\2212"}
.body{padding:0 18px 16px;color:var(--muted);font-size:14px}
.body em{display:block;font-style:normal;color:var(--ice);margin-bottom:8px}
.body ol{margin:0;padding-left:22px}.body li{margin:6px 0}.body li::marker{color:var(--neon);font-weight:700}
dl{margin:0}
dt{font:700 16px var(--head);letter-spacing:.03em;padding-top:16px;border-top:1px dashed var(--line)}
dt::before{content:"\25B8  ";color:var(--neon)}
dt:first-child{border-top:0;padding-top:0}
dd{margin:2px 0 16px 20px;color:var(--muted);font-size:14px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
footer{padding:22px 0 34px;text-align:center;color:var(--muted);font:600 12px var(--head);letter-spacing:.12em;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.badge::before{animation:none}}

/* FAQ gaming */
.faq details{background:linear-gradient(135deg,#111E50,#0A1230);border:0;border-radius:0;margin-bottom:12px;position:relative;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);box-shadow:none}
.faq details::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue);transition:.2s}
.faq details[open]{background:linear-gradient(135deg,#17286E,#0C1640);box-shadow:none}
.faq details[open]::before{background:var(--neon);box-shadow:0 0 12px var(--neon)}
.faq summary{gap:12px;justify-content:flex-start;padding:16px 16px 16px 20px;font-size:15px;letter-spacing:.04em;line-height:1.35}
.faq summary::after{margin-left:auto;border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);width:34px;background:#35E0FF14}
.qn{flex:none;font:700 11px var(--head);letter-spacing:.1em;color:#03060F;background:var(--neon);padding:3px 9px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.faq .body{padding:0 18px 18px 20px;border-top:1px dashed var(--line);margin:0 16px 0 20px;padding:14px 0 18px}
.faq .body p{margin:0}
/* Footer gaming */
.gfoot{position:relative;margin-top:12px;padding:0 0 28px;background:linear-gradient(180deg,transparent,#050B22 22%,#02040C)}
.gfoot::before{content:"";display:block;height:2px;background:linear-gradient(90deg,transparent,var(--neon),var(--blue),transparent);box-shadow:0 0 16px var(--neon)}
.hud{position:relative;margin:30px 0 0;padding:26px 18px 20px;background:linear-gradient(160deg,#0F1C4F,#0A1230 55%,#070D26);clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px);border:0}
.hud::before{content:"";position:absolute;inset:0;border:1.5px solid var(--line);clip-path:inherit;pointer-events:none}
.brand{margin:0 0 6px;font:700 22px var(--head);letter-spacing:.1em;text-transform:uppercase}
.brand b{color:var(--neon);text-shadow:0 0 10px var(--neon)}
.tag{margin:0 0 18px;color:var(--muted);font-size:14px}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.soc a{padding:9px 18px;font:700 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--ice);text-decoration:none;background:linear-gradient(135deg,#1B3FB8,#0A1230);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.fcol{padding:16px 16px 14px;background:#0A1230;border-left:3px solid var(--neon);clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.fcol.wide{grid-column:1/-1}
.fcol h4{margin:0 0 10px;font:700 12px var(--head);letter-spacing:.2em;text-transform:uppercase;color:var(--neon)}
.fcol a{display:block;padding:5px 0;color:var(--muted);font-size:14px;text-decoration:none}
.fcol a::before{content:"\25B8  ";color:var(--blue)}
.fcol a:hover,.fcol a:focus-visible{color:var(--ice);outline:none}
.copy{margin:26px 0 0;text-align:center;color:var(--muted);font:600 11px var(--head);letter-spacing:.14em;text-transform:uppercase}

/* ANIM */
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
a,summary,.vbtn,.feat,.soc a,.fcol a{-webkit-user-select:none;user-select:none;outline:none}
a:focus-visible,summary:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
/* animasi masuk saat scroll */
.js .rv{opacity:0;transform:translateY(26px) scale(.92);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s);will-change:transform,opacity}
.js .rv.in{opacity:1;transform:none}
/* animasi hero */
@keyframes popIn{from{opacity:0;transform:scale(.7) translateY(-12px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes chipIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes lineGlow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes bodyIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.topbar img{animation:popIn .7s cubic-bezier(.2,.9,.3,1.2) both}
.dev{animation:slideR .6s .15s cubic-bezier(.2,.8,.2,1) both}
.tchips span{animation:chipIn .45s cubic-bezier(.2,.9,.3,1.3) both}
.tchips span:nth-child(1){animation-delay:.35s}.tchips span:nth-child(2){animation-delay:.43s}.tchips span:nth-child(3){animation-delay:.51s}.tchips span:nth-child(4){animation-delay:.59s}.tchips span:nth-child(5){animation-delay:.67s}
.hero::after{animation:lineGlow 2.6s ease-in-out infinite}
.cicon{animation:floaty 3.4s ease-in-out infinite}
/* animasi tekan: mengecil */
.feat,details,.soc a,.fcol,.vbtn,.pcard{transition:transform .18s ease,box-shadow .25s,border-color .25s,background .25s,opacity .6s,color .2s}
.js .rv.in.feat,.js .rv.in.fcol,.js .rv.in.pcard,.js .rv.in.hud{transition:transform .18s ease,box-shadow .25s,opacity .6s}
.feat:active,.fcol:active,.soc a:active,.vbtn:active,.pcard:active{transform:scale(.95)!important}
summary{transition:color .2s}
summary:active{color:var(--neon)}
summary::after{transition:transform .3s,background .2s}
details[open] summary::after{transform:rotate(180deg);background:#35E0FF33}
details[open] .body{animation:bodyIn .35s ease both}
.fcol a{transition:transform .2s,color .2s}
.fcol a:active{transform:translateX(6px) scale(.97);color:var(--neon)}
.num{transition:transform .3s,box-shadow .3s}
.feat:active .num{transform:scale(1.15) rotate(-6deg);box-shadow:0 0 16px #35E0FF88}
@media(prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}.topbar img,.dev,.tchips span,.hero::after,.cicon,details[open] .body{animation:none}}

/* ===== INTRO: Angle Developer ===== */
#intro{display:none}
.js #intro{display:block;position:fixed;inset:0;z-index:9999;overflow:hidden;touch-action:none;background:transparent}
html.intro{overflow:hidden}
html.intro .hero *,html.intro .hero::after,html.intro .cicon{animation-play-state:paused}
.ia-half{position:absolute;left:0;right:0;height:50.5%;background-color:#03060F;background-image:radial-gradient(70% 90% at 50% 100%,#1646D955,transparent 75%),linear-gradient(#2F6BFF16 1px,transparent 1px),linear-gradient(90deg,#2F6BFF16 1px,transparent 1px);background-size:auto,36px 36px,36px 36px;transition:transform .9s cubic-bezier(.77,0,.18,1)}
.ia-top{top:0;border-bottom:2px solid var(--neon);box-shadow:0 6px 26px #35E0FF66;background-position:0 0,0 0,0 0}
.ia-bot{bottom:0;border-top:2px solid var(--neon);box-shadow:0 -6px 26px #35E0FF66;background-image:radial-gradient(70% 90% at 50% 0,#1646D955,transparent 75%),linear-gradient(#2F6BFF16 1px,transparent 1px),linear-gradient(90deg,#2F6BFF16 1px,transparent 1px)}
#intro.open .ia-top{transform:translateY(-101%)}
#intro.open .ia-bot{transform:translateY(101%)}
.ia-core{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));transition:opacity .35s ease,transform .5s ease}
#intro.open .ia-core{opacity:0;transform:scale(1.18)}
.ia-scan{position:absolute;left:0;right:0;top:0;height:90px;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent,#35E0FF22 70%,#35E0FF66 99%,transparent);animation:iaScan 2.2s linear infinite}
@keyframes iaScan{from{transform:translateY(-100px)}to{transform:translateY(100vh)}}
.ia-c{position:absolute;z-index:3;width:30px;height:30px;border:2px solid var(--neon);filter:drop-shadow(0 0 5px var(--neon));opacity:0;animation:iaFade .5s .1s forwards;transition:opacity .3s}
#intro.open .ia-c{opacity:0!important}
.ia-c.a{top:calc(16px + env(safe-area-inset-top,0px));left:16px;border-right:0;border-bottom:0}
.ia-c.b{top:calc(16px + env(safe-area-inset-top,0px));right:16px;border-left:0;border-bottom:0}
.ia-c.c{bottom:16px;left:16px;border-right:0;border-top:0}
.ia-c.d{bottom:16px;right:16px;border-left:0;border-top:0}
@keyframes iaFade{to{opacity:1}}
.ia-chip{padding:6px 18px;margin-bottom:22px;font:700 12px/1.4 var(--head);letter-spacing:.22em;text-transform:uppercase;color:var(--neon);background:#35E0FF14;border:1px solid var(--neon);box-shadow:0 0 16px #35E0FF44;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);opacity:0;animation:iaChip .5s .15s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes iaChip{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.ia-t1{position:relative;isolation:isolate;font:700 clamp(54px,19vw,104px)/1 var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--text);text-shadow:0 0 22px #2F6BFFcc;animation:iaGlitch .85s 1.25s steps(1,end) 2}
.ia-t1::before,.ia-t1::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;opacity:0}
.ia-t1::before{color:#35E0FF;text-shadow:-3px 0 #35E0FF;animation:iaGlitchLayerA 1.15s 1.25s steps(1,end) 2}
.ia-t1::after{color:#2F6BFF;text-shadow:3px 0 #2F6BFF;animation:iaGlitchLayerB 1.15s 1.25s steps(1,end) 2}
@keyframes iaGlitchLayerA{
  0%,8%,18%,28%,38%,48%,58%,68%,78%,88%,100%{opacity:0;transform:translateX(0);clip-path:inset(0 0 0 0)}
  10%{opacity:.9;transform:translateX(-5px);clip-path:inset(8% 0 68% 0)}
  20%{opacity:.85;transform:translateX(4px);clip-path:inset(42% 0 38% 0)}
  30%{opacity:.9;transform:translateX(-3px);clip-path:inset(72% 0 8% 0)}
  40%{opacity:.8;transform:translateX(5px);clip-path:inset(25% 0 55% 0)}
  50%{opacity:.9;transform:translateX(-4px);clip-path:inset(55% 0 25% 0)}
  60%{opacity:.75;transform:translateX(3px);clip-path:inset(12% 0 72% 0)}
  70%{opacity:.9;transform:translateX(-5px);clip-path:inset(64% 0 16% 0)}
  80%{opacity:.8;transform:translateX(3px);clip-path:inset(35% 0 45% 0)}
}
@keyframes iaGlitchLayerB{
  0%,8%,18%,28%,38%,48%,58%,68%,78%,88%,100%{opacity:0;transform:translateX(0);clip-path:inset(0 0 0 0)}
  10%{opacity:.8;transform:translateX(5px);clip-path:inset(62% 0 18% 0)}
  20%{opacity:.9;transform:translateX(-4px);clip-path:inset(18% 0 62% 0)}
  30%{opacity:.8;transform:translateX(4px);clip-path:inset(48% 0 32% 0)}
  40%{opacity:.9;transform:translateX(-5px);clip-path:inset(6% 0 74% 0)}
  50%{opacity:.8;transform:translateX(3px);clip-path:inset(78% 0 4% 0)}
  60%{opacity:.9;transform:translateX(-3px);clip-path:inset(32% 0 48% 0)}
  70%{opacity:.8;transform:translateX(5px);clip-path:inset(56% 0 24% 0)}
  80%{opacity:.9;transform:translateX(-3px);clip-path:inset(22% 0 58% 0)}
}
.ia-t2{margin-top:10px;padding-left:.45em;font:700 clamp(17px,5.8vw,30px)/1 var(--head);letter-spacing:.45em;text-transform:uppercase;color:var(--neon);text-shadow:0 0 14px var(--neon)}
.ia-l{display:inline-block;opacity:0;transform:translateY(44px) scale(.55) skewX(-14deg);filter:blur(9px);animation:iaLet .55s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--ld,0s)}
@keyframes iaLet{to{opacity:1;transform:none;filter:none}}
@keyframes iaGlitch{0%{text-shadow:-5px 0 #35E0FF,5px 0 #2F6BFF;transform:translateX(3px)}20%{text-shadow:5px 0 #35E0FF,-5px 0 #2F6BFF;transform:translateX(-4px) skewX(-6deg)}40%{text-shadow:-3px 0 #35E0FF,3px 0 #2F6BFF;transform:translateX(2px)}60%{text-shadow:4px 0 #35E0FF,-4px 0 #2F6BFF;transform:none}80%{text-shadow:-2px 0 #35E0FF,2px 0 #2F6BFF;transform:translateX(-2px)}100%{text-shadow:0 0 22px #2F6BFFcc;transform:none}}
.ia-load{width:min(80vw,330px);margin-top:36px;opacity:0;animation:iaFade .4s .9s forwards}
.ia-row{display:flex;justify-content:space-between;margin-bottom:8px;font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ia-pct{color:var(--neon);text-shadow:0 0 8px var(--neon);font-variant-numeric:tabular-nums}
.ia-bar{height:8px;background:#0A1230;border:1px solid var(--line);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);padding:1px}
.ia-fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--neon));box-shadow:0 0 12px var(--neon)}
.ia-skip{position:absolute;z-index:4;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:8px 16px;font:700 11px var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--ice);background:#0A1230cc;border:1px solid var(--line);cursor:pointer;opacity:0;animation:iaFade .4s 1s forwards;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.ia-skip:active{color:var(--neon);border-color:var(--neon)}
#intro.open .ia-skip{opacity:0!important}

/* ===== ANIMASI SAAT DITEKAN ===== */
.tap-ring,.tap-spark{position:fixed;z-index:9998;pointer-events:none;left:0;top:0}
.tap-ring{width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:2px solid var(--neon);box-shadow:0 0 14px var(--neon),inset 0 0 12px #35E0FF66}
.tap-spark{width:12px;height:3px;margin:-1.5px 0 0 -6px;border-radius:2px;background:var(--neon);box-shadow:0 0 8px var(--neon)}
@media(prefers-reduced-motion:reduce){.ia-scan,.ia-t1,.ia-t1::before,.ia-t1::after,.spring{animation:none}.ia-half,.ia-core{transition:none}.ia-l{animation-duration:.01s;animation-delay:0s}}

/* ===== MENU TITIK 3 ===== */
.hero{padding-top:64px}
.kbtn{position:fixed;z-index:9000;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:14px;border:1.5px solid var(--blue);background:#0A1230e6;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 18px #2F6BFF55;cursor:pointer;transition:transform .18s ease,border-color .25s,box-shadow .25s,opacity .4s}
