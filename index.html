<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b16">
  <title>ANGLE DEV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #f4f8ff;
      background:
        radial-gradient(ellipse at 50% 12%, rgba(0, 133, 255, .30), transparent 48%),
        linear-gradient(155deg, #030609 0%, #07182b 48%, #020509 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 34px 20px;
    }
    .page {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .avatar {
      width: 142px;
      height: 142px;
      margin: 0 auto 22px;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(65, 177, 255, .55);
      box-shadow: 0 0 28px rgba(0, 137, 255, .20);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    h1 {
      margin: 0;
      font-size: 29px;
      letter-spacing: 3px;
      font-weight: 800;
    }
    .subtitle {
      margin: 9px 0 34px;
      color: #a9c8e7;
      font-size: 14px;
      letter-spacing: .5px;
    }
    .links {
      display: grid;
      gap: 15px;
    }
    .link {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      color: #f7fbff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .4px;
      border: 1.5px solid rgba(75, 174, 255, .75);
      border-radius: 13px;
      background: rgba(16, 54, 86, .30);
      box-shadow: inset 0 0 18px rgba(35, 145, 255, .06);
      backdrop-filter: blur(8px);
      transition: .18s ease;
    }
    .link:hover, .link:focus-visible {
      background: rgba(26, 112, 180, .35);
      border-color: #79c5ff;
      transform: translateY(-2px);
      outline: none;
    }
    .link svg {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      fill: currentColor;
    }
    footer {
      margin-top: 34px;
      color: #6f8eaa;
      font-size: 11px;
      letter-spacing: 1.2px;
    }
  </style>
</head>
